name: Offline accounts implementation

on:
  push:
    branches: [offline-accounts]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: implement offline accounts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-accounts
          fetch-depth: 0

      - name: Apply offline account support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 1) Theseus authentication: mark offline credentials with a local sentinel,
          # never refresh them, and never contact Mojang for their profile.
          replace_once(
              'packages/app-lib/src/state/minecraft_auth.rs',
              '''    async fn refresh(\n        &mut self,\n        exec: impl sqlx::Executor<'_, Database = sqlx::Sqlite> + Copy,\n    ) -> crate::Result<()> {\n        // Use a margin of 5 minutes''',
              '''    async fn refresh(\n        &mut self,\n        exec: impl sqlx::Executor<'_, Database = sqlx::Sqlite> + Copy,\n    ) -> crate::Result<()> {\n        // Offline testing credentials never contact Microsoft/Xbox/Mojang and never refresh.\n        if self.access_token.starts_with("offline:") {\n            return Ok(());\n        }\n\n        // Use a margin of 5 minutes'''
          )

          replace_once(
              'packages/app-lib/src/state/minecraft_auth.rs',
              '''    pub async fn maybe_online_profile(\n        &self,\n    ) -> MaybeOnlineMinecraftProfile<'_> {\n        let online_profile = self.online_profile().await;''',
              '''    pub async fn maybe_online_profile(\n        &self,\n    ) -> MaybeOnlineMinecraftProfile<'_> {\n        if self.access_token.starts_with("offline:") {\n            return MaybeOnlineMinecraftProfile::Offline(&self.offline_profile);\n        }\n\n        let online_profile = self.online_profile().await;'''
          )

          anchor = '''#[derive(Deserialize, Debug)]\npub struct Credentials {'''
          insertion = '''/// Creates a local-only Minecraft account for testing.\n///\n/// This intentionally does not perform Microsoft, Xbox, or Mojang authentication.\n/// The generated credential is only suitable for local/offline Minecraft sessions.\npub async fn create_offline_user(name: &str) -> crate::Result<Credentials> {\n    let name = name.trim();\n    if name.len() < 3 || name.len() > 16 {\n        return Err(io::Error::other("Minecraft usernames must be 3-16 characters").into());\n    }\n    if !name.chars().all(|c| c.is_ascii_alphanumeric() || c == '_') {\n        return Err(io::Error::other("Minecraft usernames may only contain letters, numbers, and underscores").into());\n    }\n\n    let credentials = Credentials {\n        offline_profile: MinecraftProfile {\n            id: Uuid::new_v4(),\n            name: name.to_string(),\n            ..MinecraftProfile::default()\n        },\n        access_token: format!("offline:{}", Uuid::new_v4()),\n        refresh_token: "offline".to_string(),\n        expires: Utc::now() + Duration::days(36500),\n        active: true,\n    };\n\n    let state = crate::State::get().await?;\n    credentials.upsert(&state.pool).await?;\n    Ok(credentials)\n}\n\n#[derive(Deserialize, Debug)]\npub struct Credentials {'''
          replace_once('packages/app-lib/src/state/minecraft_auth.rs', anchor, insertion)

          # 2) Launcher arguments: use the offline identity and legacy user type for these credentials.
          replace_once(
              'packages/app-lib/src/launcher/args.rs',
              '''    let access_token = credentials.access_token.clone();\n    let profile = credentials.maybe_online_profile().await;\n    let mut parsed_arguments = Vec::new();''',
              '''    let access_token = credentials.access_token.clone();\n    let is_offline = access_token.starts_with("offline:");\n    let (profile_name, profile_id) = if is_offline {\n        (credentials.offline_profile.name.clone(), credentials.offline_profile.id)\n    } else {\n        let profile = credentials.maybe_online_profile().await;\n        (profile.name.clone(), profile.id)\n    };\n    let mut parsed_arguments = Vec::new();'''
          )
          replace_once('packages/app-lib/src/launcher/args.rs', '&profile.name,\n                    profile.id,', '&profile_name,\n                    profile_id,')
          replace_once('packages/app-lib/src/launcher/args.rs', '&profile.name,\n                profile.id,', '&profile_name,\n                profile_id,')
          replace_once('packages/app-lib/src/launcher/args.rs', '.replace("${user_type}", "msa")', '.replace("${user_type}", if access_token.starts_with("offline:") { "legacy" } else { "msa" })')

          # 3) Tauri API wrapper.
          replace_once(
              'apps/app/src/api/auth.rs',
              '''            get_users,\n        ])''',
              '''            get_users,\n            create_offline_user,\n        ])'''
          )
          insert_api = '''\n#[tauri::command]\npub async fn create_offline_user(name: String) -> Result<Credentials> {\n    Ok(minecraft_auth::create_offline_user(&name).await?)\n}\n'''
          anchor_api = '''/// Get a copy of the list of all user credentials\n#[tauri::command]\npub async fn get_users() -> Result<Vec<Credentials>> {\n    Ok(minecraft_auth::users().await?)\n}\n'''
          replace_once('apps/app/src/api/auth.rs', anchor_api, anchor_api + insert_api)

          # 4) Frontend API helper.
          replace_once(
              'apps/app-frontend/src/helpers/auth.js',
              '''export async function users() {\n\treturn await invoke('plugin:auth|get_users')\n}\n''',
              '''export async function users() {\n\treturn await invoke('plugin:auth|get_users')\n}\n\nexport async function create_offline_user(name) {\n\treturn await invoke('plugin:auth|create_offline_user', { name })\n}\n'''
          )

          # 5) Frontend account picker: offline account is available directly, without Microsoft sign-in.
          replace_once(
              'apps/app-frontend/src/components/ui/AccountsCard.vue',
              '''\tget_default_user,\n\tlogin as login_flow,''',
              '''\tcreate_offline_user,\n\tget_default_user,\n\tlogin as login_flow,'''
          )
          replace_once(
              'apps/app-frontend/src/components/ui/AccountsCard.vue',
              '''\t\t<Button type="colored" color="brand" :disabled="loginDisabled" @click="login()">\n\t\t\t<LogInIcon v-if="!loginDisabled" />\n\t\t\t<SpinnerIcon v-else class="animate-spin" />\n\t\t\t{{ formatMessage(messages.signInToMinecraft) }}\n\t\t</Button>''',
              '''\t\t<Button type="colored" color="brand" :disabled="loginDisabled" @click="login()">\n\t\t\t<LogInIcon v-if="!loginDisabled" />\n\t\t\t<SpinnerIcon v-else class="animate-spin" />\n\t\t\t{{ formatMessage(messages.signInToMinecraft) }}\n\t\t</Button>\n\t\t<Button class="w-full" :disabled="loginDisabled" @click="addOfflineAccount()">\n\t\t\t<PlusIcon />\n\t\t\tOffline account (testing)\n\t\t</Button>'''
          )
          replace_once(
              'apps/app-frontend/src/components/ui/AccountsCard.vue',
              '''\t\t\t<div class="flex flex-col gap-2 px-2 pt-2">\n\t\t\t\t<Button\n\t\t\t\t\tv-if="accounts.length > 0"''',
              '''\t\t\t<div class="flex flex-col gap-2 px-2 pt-2">\n\t\t\t\t<Button\n\t\t\t\t\tv-if="accounts.length > 0"'''
          )
          replace_once(
              'apps/app-frontend/src/components/ui/AccountsCard.vue',
              '''\t\t\t\t\t{{ formatMessage(messages.addAccount) }}\n\t\t\t\t</Button>\n\t\t\t</div>''',
              '''\t\t\t\t\t{{ formatMessage(messages.addAccount) }}\n\t\t\t\t</Button>\n\t\t\t\t<Button\n\t\t\t\t\tclass="w-full !bg-button-bg !text-primary ![box-shadow:var(--shadow-button)]"\n\t\t\t\t\t:disabled="loginDisabled"\n\t\t\t\t\t@click="addOfflineAccount()"\n\t\t\t\t>\n\t\t\t\t\t<PlusIcon />\n\t\t\t\t\tOffline account (testing)\n\t\t\t\t</Button>\n\t\t\t</div>'''
          )
          replace_once(
              'apps/app-frontend/src/components/ui/AccountsCard.vue',
              '''async function login() {\n\tloginDisabled.value = true''',
              '''async function addOfflineAccount() {\n\tconst name = window.prompt('Offline testing account username', 'TestPlayer')?.trim()\n\tif (!name) return\n\n\tloginDisabled.value = true\n\ttry {\n\t\tconst account = await create_offline_user(name)\n\t\tawait setAccount(account)\n\t} catch (error) {\n\t\thandleError(error)\n\t} finally {\n\t\tloginDisabled.value = false\n\t}\n}\n\nasync function login() {\n\tloginDisabled.value = true'''
          )

          # 6) Add a Windows 10-compatible build workflow. The runner is Windows 2022,
          # while the produced NSIS installer targets x64 Windows and is intended for Windows 10+.
          Path('.github/workflows/offline-windows-build.yml').write_text(r'''name: Offline launcher - Windows build\n\non:\n  workflow_dispatch:\n  push:\n    branches: [offline-accounts]\n    paths:\n      - 'packages/app-lib/**'\n      - 'apps/app/**'\n      - 'apps/app-frontend/**'\n      - '.github/workflows/offline-windows-build.yml'\n\npermissions:\n  contents: read\n\njobs:\n  build-windows:\n    runs-on: windows-2022\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: pnpm/action-setup@v4\n        with:\n          version: 10.33.2\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 24.15.0\n          cache: pnpm\n\n      - uses: dtolnay/rust-toolchain@stable\n        with:\n          targets: x86_64-pc-windows-msvc\n\n      - name: Install dependencies\n        run: pnpm install --frozen-lockfile\n\n      - name: Build Windows application\n        run: pnpm app:build\n        env:\n          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc\n\n      - name: Upload Windows installers\n        uses: actions/upload-artifact@v4\n        with:\n          name: My-Modrinth-App-Windows-x64\n          path: |\n            apps/app/src-tauri/target/release/bundle/nsis/*.exe\n            apps/app/src-tauri/target/release/bundle/msi/*.msi\n          if-no-files-found: error\n'''.replace('\\n','\n'), encoding='utf-8')

          print('Offline account source patch completed.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/app-lib/src/state/minecraft_auth.rs packages/app-lib/src/launcher/args.rs apps/app/src/api/auth.rs apps/app-frontend/src/helpers/auth.js apps/app-frontend/src/components/ui/AccountsCard.vue .github/workflows/offline-windows-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement offline accounts"
          git push origin offline-accounts
