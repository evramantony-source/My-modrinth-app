name: Build Modrinth App for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - offline-accounts

permissions:
  contents: read

env:
  MODRINTH_API_URL: https://api.modrinth.com/v2/
  MODRINTH_API_URL_V3: https://api.modrinth.com/v3/
  MODRINTH_API_BASE_URL: https://api.modrinth.com/
  SHARED_INSTANCES_API_BASE_URL: https://api.modrinth.com/
  MODRINTH_LAUNCHER_META_URL: https://launcher-meta.modrinth.com/
  MODRINTH_SOCKET_URL: wss://socket.modrinth.com/
  MODRINTH_URL: https://modrinth.com/

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      - name: Setup Rust 1.95 for Windows
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows application
        run: pnpm app:build
        env:
          CI: true
          RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Modrinth-App-Windows-x64
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            apps/app/target/release/bundle/nsis/*.exe
            apps/app/target/release/bundle/msi/*.msi

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Modrinth-App-Windows-x64-portable
          if-no-files-found: warn
          path: |
            target/release/*.exe
            apps/app/target/release/*.exe
