name: Build Modrinth App for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - offline-accounts

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows application
        run: pnpm --filter @modrinth/app build
        env:
          CI: true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Modrinth-App-Windows-x64
          if-no-files-found: error
          path: |
            apps/app/target/release/bundle/nsis/*.exe
            apps/app/target/release/bundle/msi/*.msi

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Modrinth-App-Windows-x64-portable
          if-no-files-found: error
          path: apps/app/target/release/Modrinth App.exe

  # This second job intentionally makes a new push when the workflow file is changed,
  # ensuring the corrected workflow is exercised on the offline-accounts branch.
